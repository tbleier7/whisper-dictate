[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-dictate"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "keyboard",
    "PyQt6",
    # CUDA runtime libs for the GPU path, installed automatically on win/linux so
    # `pip install whisper-dictate` gives GPU transcription out of the box. cuDNN
    # is bundled inside the ctranslate2 wheel; cuBLAS pulls NVRTC transitively but
    # we pin it explicitly so the GPU closure does not depend on that staying true.
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
whisper-dictate = "whisper_dictate.app:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["whisper_dictate*"]
